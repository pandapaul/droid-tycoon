<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Droid Tycoon — Rebirth Print Sheets</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --muted: #555;
      --rule: #ccc;
      /* Solid print-safe colors: readable on white, distinct in color prints */
      --skin-default: #5b6470;
      --skin-gold: #a16207;
      --skin-diamond: #0e7490;
      --skin-rainbow: #a21caf;
      --skin-beskar: #334155;
      --skin-galactic: #6d28d9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: #f4f4f4;
      line-height: 1.25;
    }
    .screen-bar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
      padding: 0.75rem 1rem;
      background: #111;
      color: #f5f5f5;
      font-size: 0.9rem;
    }
    .screen-bar a { color: #9fd3ff; }
    .screen-bar button {
      font: inherit;
      padding: 0.4rem 0.8rem;
      border: 1px solid #666;
      background: #222;
      color: #fff;
      cursor: pointer;
    }
    .sheet {
      max-width: 8.5in;
      width: calc(100% - 2rem);
      margin: 1rem auto;
      padding: 0.4in 0.45in;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    h1 {
      margin: 0 0 0.15rem;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
    }
    .meta {
      margin: 0 0 0.6rem;
      color: var(--muted);
      font-size: 0.78rem;
    }
    table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 0.68rem;
    }
    th, td {
      border-bottom: 1px solid var(--rule);
      padding: 0.22rem 0.3rem;
      vertical-align: middle;
      text-align: left;
      overflow-wrap: anywhere;
    }
    th {
      border-bottom: 2px solid var(--ink);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      vertical-align: bottom;
    }
    tr:nth-child(even) td { background: #fafafa; }
    .mark {
      width: 2.75rem;
      padding-left: 0.15rem;
      padding-right: 0.2rem;
    }
    .mark-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0;
      cursor: pointer;
      min-height: 1.1rem;
    }
    .mark-row input {
      width: 0.8rem;
      height: 0.8rem;
      margin: 0;
      padding: 0;
      flex-shrink: 0;
      accent-color: var(--ink);
    }
    .lvl {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      display: inline-block;
    }
    .credits {
      width: 4rem;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    th.credits {
      letter-spacing: 0.02em;
      overflow: hidden;
    }
    .req {
      display: block;
      white-space: normal;
      line-height: 1.3;
    }
    .skin {
      font-weight: 700;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .skin-default { color: var(--skin-default); }
    .skin-gold { color: var(--skin-gold); }
    .skin-diamond { color: var(--skin-diamond); }
    .skin-rainbow { color: var(--skin-rainbow); }
    .skin-beskar { color: var(--skin-beskar); }
    .skin-galactic { color: var(--skin-galactic); }
    .action {
      color: var(--muted);
      font-size: 0.62rem;
    }
    .legend {
      margin-top: 0.5rem;
      font-size: 0.68rem;
      color: var(--muted);
    }
    .legend .skin { margin: 0 0.05rem; }
    @media print {
      body { background: #fff; }
      .screen-bar { display: none !important; }
      .sheet {
        max-width: none;
        width: auto;
        margin: 0;
        padding: 0.25in 0.3in;
        box-shadow: none;
        page-break-after: always;
        overflow: visible;
      }
      .sheet:last-child { page-break-after: auto; }
      tr:nth-child(even) td { background: transparent; }
      table { font-size: 0.62rem; }
      .skin {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <div class="screen-bar">
    <strong>Print sheets</strong>
    <span>One cycle per page · use Print → Save as PDF to share</span>
    <button type="button" onclick="window.print()">Print / Save PDF</button>
    <a href="index.html">Interactive lookup</a>
  </div>
  <div id="root"></div>
  <script src="data.js"></script>
  <script>
    const D = window.REBIRTH_DATA;
    const skinSpan = (skin) => {
      const label = skin.charAt(0).toUpperCase() + skin.slice(1);
      return `<span class="skin skin-${skin}">${label}</span>`;
    };
    const fmtReq = (req) => {
      const name = D.droids[req.droid]?.name || req.droid;
      const rarity = req.rarity.charAt(0).toUpperCase() + req.rarity.slice(1);
      const action = req.action.type === 'sell'
        ? 'safe to sell'
        : `next L${req.action.level}`;
      return `<span class="req">${name} · ${skinSpan(req.skin)} ${rarity} <span class="action">(${action})</span></span>`;
    };
    const legendSkins = ['default', 'gold', 'diamond', 'rainbow', 'beskar', 'galactic']
      .map(skinSpan)
      .join(' · ');
    const root = document.getElementById('root');
    for (let c = 1; c <= D.cycles; c++) {
      const cycle = D.cycleData[String(c)];
      const rows = cycle.levels.map((lvl) => {
        const cost = D.costs[String(lvl.level)];
        const [a, b, d] = lvl.requirements;
        return `<tr>
          <td class="mark">
            <label class="mark-row">
              <input type="checkbox" aria-label="Done level ${lvl.level}" />
              <span class="lvl">${lvl.level}</span>
            </label>
          </td>
          <td class="credits">${cost.display}</td>
          <td>${fmtReq(a)}</td>
          <td>${fmtReq(b)}</td>
          <td>${fmtReq(d)}</td>
        </tr>`;
      }).join('');
      const sheet = document.createElement('section');
      sheet.className = 'sheet';
      sheet.innerHTML = `
        <h1>Star Wars: Droid Tycoon — ${cycle.name}</h1>
        <p class="meta">Check boxes as you clear levels. Higher skins count for lower skin requirements.</p>
        <table>
          <thead>
            <tr>
              <th class="mark">Lvl</th>
              <th class="credits">Credits</th>
              <th>Droid 1</th>
              <th>Droid 2</th>
              <th>Droid 3</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <p class="legend">Skins: ${legendSkins}. Tip: safe to sell, or next level that needs this droid.</p>
      `;
      root.appendChild(sheet);
    }
  </script>
</body>
</html>
